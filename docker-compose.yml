# ===================================================================
# EconoCausal: Multi-Container Microservice Orchestration
# ===================================================================
version: '3.8'

services:
  # 1. FastAPI Causal Serving Microservice
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: econocausal-api
    restart: unless-stopped
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_PATH=/app/models/double_ml_model.pkl
      - DATA_PATH=/app/data/synthetic_dynamic_pricing.csv
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - econocausal-net

  # 2. Streamlit Visual Intelligence & Governance Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: econocausal-dashboard
    restart: unless-stopped
    command: ["streamlit", "run", "app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - API_URL=http://api:8000
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy
    networks:
      - econocausal-net

networks:
  econocausal-net:
    driver: bridge

